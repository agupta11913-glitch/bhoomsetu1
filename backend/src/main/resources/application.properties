# BhoomiSetu Spring Boot Configuration
spring.application.name=bhoomisetu-backend
server.port=8080

# MySQL Database Connection (Configured with environment variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bhoomisetu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Anand123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Logging
logging.level.com.bhoomisetu=DEBUG
logging.level.org.springframework.security=INFO
